if(S.mode==='rsa')return rsa();if(S.page==='cat')return catPage();if(S.view==='list')list();else if(S.view==='detail')detail(items.find(x=>x.id===S.cur.id)||items[0])}
document.addEventListener('click',e=>{const m=e.target.closest('#modeSeg button');if(m){S.mode=m.dataset.m;S.view='list';render();return}

const rb=e.target.closest('button[data-r]');if(rb){rt(rb.dataset.r);return}const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
if(a==='ug'){S.ug='list';S.q='';S.uf=null;S.more={};render();return}if(a==='ughome'){S.ug='list';S.uf=null;S.q='';S.more={};render();return}if(a==='ugf'){S.ug='list';S.uf=+t.dataset.i;S.q='';render();return}if(a==='more'){const k=t.dataset.v;S.more[k]=(S.more[k]||PG)+PG;ugFill();return}if(a==='pop'){popFirst();return}if(a==='ugtg'){S.op[t.dataset.v]=t.getAttribute('aria-expanded')!=='true';ugFill();return}if(a==='ugclose'){S.ug=null;render();return}if(a==='ugopen'){S.ug=t.dataset.i;render();return}if(a==='ugback'){if(S.ug&&S.ug!=='list')S.ug='list';else if(S.uf)S.uf=(cById(S.uf)||{}).parent||null;else if(S.q)S.q='';else S.ug=null;render();return}if(a==='vplay'){if(!t.classList.contains('on'))vPlayer(t);return}if(a==='vtog'){const bx=t.closest('.vp');if(bx._t>=VDUR){vPlayer(bx);return}bx._p=!bx._p;t.textContent=bx._p?'▶':'⏸';t.setAttribute('aria-label',bx._p?'Phát':'Tạm dừng');return}if(a==='vseek'){const bx=t.closest('.vp'),r=t.getBoundingClientRect();bx._seek((e.clientX-r.left)/r.width);return}if(a==='vfs'){const bx=t.closest('.vp');if(document.fullscreenElement)document.exitFullscreen();else if(bx.requestFullscreen)bx.requestFullscreen();return}if(a==='ff'){OFF+=D;const c=tick();render();toast(c?`Tua +1 ngày: ${c} bản chuyển sang Đã phát hành`:'Đã tua +1 ngày');return}

if(S.mode==='eho')act(a,t.dataset.i,t)});

else if(e.target.id==='rti'){addImgs(e.target.files);e.target.value=''}

/* ---------- Dropdown có tìm kiếm (dùng cho chọn Tính năng & Thuộc tính năng) ---------- */
const CBO={};
function cbx(id,opts,sel,ph,dis){CBO[id]={opts,ph};const o=opts.find(x=>String(x.v)===String(sel??''));
return `<div class="cbx" data-cb="${id}"><input type="hidden" id="${id}" value="${o?o.v:''}"><button type="button" class="cbx-b" data-cbt="${id}" ${dis?'disabled':''} aria-haspopup="listbox" aria-expanded="false"><span class="${o?'':'cbx-ph'}">${o?esc(o.path||o.label):esc(ph)}</span><span aria-hidden="true">▾</span></button><div class="cbx-p" hidden><input type="text" class="cbx-q" placeholder="Tìm tính năng..." aria-label="Tìm tính năng" autocomplete="off"><div class="cbx-l" role="listbox"></div></div></div>`}
function cbList(id,q){const w=document.querySelector(`[data-cb="${id}"]`),cur=w.querySelector('input[type=hidden]').value,k=q.trim().toLocaleLowerCase('vi');
const os=CBO[id].opts.filter(x=>!k||(x.path||x.label).toLocaleLowerCase('vi').includes(k));
w.querySelector('.cbx-l').innerHTML=os.length?os.map(x=>`<button type="button" role="option" class="cbx-o ${x.lv>1&&!k?'l2':''} ${x.dis?'dis':''} ${String(x.v)===cur?'on':''}" style="${x.lv>1&&!k?'padding-left:'+(10+(x.lv-1)*18)+'px':''}" data-cbo="${id}" data-v="${x.v}" ${x.dis?`aria-disabled="true" title="${esc(x.hint||'')}"`:''}>${esc(k&&x.path?x.path:x.label)}${x.dis&&x.hint?`<small>${esc(x.hint)}</small>`:''}</button>`).join(''):'<div class="hint" style="padding:8px 10px">Không tìm thấy tính năng</div>'}
function cbClose(){document.querySelectorAll('.cbx-p:not([hidden])').forEach(p=>{p.hidden=true;p.previousElementSibling.setAttribute('aria-expanded','false')})}
const featOpts=()=>{const o=[],w=(list,d)=>list.forEach(c=>{o.push({v:c.id,label:c.name,path:cPath(c.id),lv:d});w(feats(c.id),d+1)});w(groups(),1);return o};
document.addEventListener('click',e=>{const t=e.target.closest('[data-cbt]');if(t){const p=t.nextElementSibling,op=p.hidden;cbClose();if(op){p.hidden=false;t.setAttribute('aria-expanded','true');const q=p.querySelector('.cbx-q');q.value='';cbList(t.dataset.cbt,'');q.focus()}return}
const o=e.target.closest('[data-cbo]');if(o){if(o.classList.contains('dis'))return;const id=o.dataset.cbo,w=document.querySelector(`[data-cb="${id}"]`),x=CBO[id].opts.find(x=>String(x.v)===o.dataset.v);w.querySelector('input[type=hidden]').value=x.v;w.querySelector('.cbx-b span').className='';w.querySelector('.cbx-b span').textContent=x.path||x.label;cbClose();w.querySelector('.cbx-b').focus();return}
if(!e.target.closest('.cbx'))cbClose()},true);
document.addEventListener('input',e=>{if(e.target.classList.contains('cbx-q'))cbList(e.target.closest('[data-cb]').dataset.cb,e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.cbx-p:not([hidden])')){e.stopPropagation();cbClose()}});

document.addEventListener('mousedown',e=>{if(e.target.closest('#rtb button'))e.preventDefault()});
document.addEventListener('selectionchange',()=>{const s=getSelection(),ed=$('#f_d');if(ed&&s.rangeCount&&ed.contains(s.anchorNode))rg=s.getRangeAt(0).cloneRange()});
document.addEventListener('paste',e=>{if(e.target.closest&&e.target.closest('#f_d')){e.preventDefault();const cd=e.clipboardData||window.clipboardData,im=[...(cd.files||[])].filter(f=>/^image\//.test(f.type));if(im.length){addImgs(im);return}document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}});
